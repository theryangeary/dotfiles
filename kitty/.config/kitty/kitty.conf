editor nvim

# hints
# open URL
map ctrl+shift+e kitten hints --program /usr/bin/open --program @
# insert path
map ctrl+shift+p>f kitten hints --type path --program - --program @
# insert line
map ctrl+shift+p>l kitten hints --type line --program - --program @
# insert word
map ctrl+shift+p>w kitten hints --type word --program - --program @
# insert git hash
map ctrl+shift+p>h kitten hints --type hash --program - --program @
# open file:line in nvim
map ctrl+shift+p>n kitten hints --type regex --regex "placeholder" --customize-processing ~/.config/kitty/nvim_hints.py
# open hyperlink in browser
map ctrl+shift+p>y kitten hints --type hyperlink --program /usr/bin/open --program @


# mouse
# cmd+click opens links even when a TUI app has grabbed the mouse (nvim, less,
# fzf). Plain left click stays with the app; kitty's default only handles links
# on a plain click when the mouse is ungrabbed.
mouse_map cmd+left click grabbed,ungrabbed mouse_handle_click link

notify_on_cmd_finish always
macos_option_as_alt both
macos_quit_when_last_window_closed yes
shell_integration enabled
font_size 14
allow_remote_control yes
listen_on unix:/tmp/mykitty-{kitty_pid}
text_fg_override_threshold 4.5 ratio

window_margin_width 0
single_window_margin_width 0
window_padding_width 0 0 0 3

# Make the focused split obvious: dim the text of unfocused windows.
inactive_text_alpha 0.6

tab_bar_style separator
tab_separator " | "
tab_bar_edge bottom
# upstream vertical tabs (>=0.48) auto-size the bar to tab content; no width option
tab_activity_symbol "⏳ "
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{index}:{title}"

# Splits = freeform tiling, Stack = one window full screen (kitty_mod+l toggles).
# equalize_on_window_close: remaining splits rebalance to equal sizes on close.
enabled_layouts Splits:equalize_on_window_close=yes, Stack

map f1 toggle_tab_bar
map f2 launch --type=os-window /opt/homebrew/bin/nvim ~/todo.md
map f3 detach_window new-tab
# vsplit: new window to the right (tall); hsplit: new window below.
# Equalize afterwards so splits stay equal-sized, like the Tall layout.
map cmd+enter combine : launch --location=vsplit --cwd=current : layout_action equalize
map cmd+shift+enter combine : launch --location=hsplit --cwd=current : layout_action equalize
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9
map kitty_mod+j next_tab
map kitty_mod+k previous_tab

